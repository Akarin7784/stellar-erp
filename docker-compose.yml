services:
  postgres:
    image: postgres:18.6
    container_name: stellar-erp-postgres
    environment:
      POSTGRES_DB: stellar_erp
      POSTGRES_USER: erp
      # 从 .env 读取；未配置时使用本地开发默认值（仅限开发环境）
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - erp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d stellar_erp"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8.3
    container_name: stellar-erp-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - erp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.4.0-management
    container_name: stellar-erp-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: erp
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-erp_dev_password}
      TZ: Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - erp-rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  erp-pgdata:
  erp-redisdata:
  erp-rabbitmqdata:
