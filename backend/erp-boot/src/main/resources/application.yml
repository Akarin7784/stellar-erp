server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stellar-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stellar_erp}
    username: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

sa-token:
  token-name: Authorization
  timeout: 86400
  is-read-cookie: false
  is-print: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.stellar.erp: info
