server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stellar-erp
  profiles:
    # 未显式指定 SPRING_PROFILES_ACTIVE 时使用 dev（本地开发）；生产必须设置 SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    # 不在此处提供默认值；dev 默认值见 application-dev.yml，prod 由环境变量提供
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

sa-token:
  token-name: Authorization
  timeout: 86400
  is-read-cookie: false
  is-print: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.stellar.erp: info
