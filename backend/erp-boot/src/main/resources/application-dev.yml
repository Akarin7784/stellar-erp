# 本地开发配置（spring.profiles.default=dev）。默认值与 docker-compose.yml / .env.example 一致，仅用于本地。
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stellar_erp}
    # 应用账号（非 owner，受 RLS 约束）
    username: ${DB_APP_USER:erp_app}
    password: ${DB_APP_PASSWORD:erp_app_dev_password}
  flyway:
    # 迁移账号（owner）
    user: ${DB_USER:erp}
    password: ${DB_PASSWORD:erp_dev_password}
    placeholders:
      erp_app_password: ${DB_APP_PASSWORD:erp_app_dev_password}
