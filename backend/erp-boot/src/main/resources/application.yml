server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: stellar-erp
  profiles:
    # 未显式指定 SPRING_PROFILES_ACTIVE 时使用 dev（本地开发）；生产必须设置 SPRING_PROFILES_ACTIVE=prod
    default: dev
  datasource:
    # 不在此处提供默认值；dev 默认值见 application-dev.yml，prod 由环境变量提供
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # Flowable 引擎表位于独立 schema flowable（issue #7）；业务表在 public。每个连接建立时设置 search_path。
      connection-init-sql: SET search_path TO public, flowable
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

flowable:
  # 引擎表由 Flyway 迁移 db/migration/wf/V202610200801__wf_create_flowable_schema.sql 预先创建（owner 账号）。
  # 不设置 flowable.database-schema：它会对连接调用 setSchema()，把池化连接的 search_path 改成仅 flowable，业务表随之不可见。
  # 表定位统一靠 hikari connection-init-sql 的 search_path。
  # false = 启动时只校验表版本，不建表/不升级；应用账号不需要 CREATE 权限。升级 Flowable 时以新迁移执行官方 upgrade 脚本。
  database-schema-update: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

sa-token:
  token-name: Authorization
  timeout: 86400
  is-read-cookie: false
  is-print: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.stellar.erp: info
